<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>هناك رسالة لا يجب أن يقرأها الجميع</title>
<style>
/*__FONTS__*/
:root { --purple:#4F29B7; --white:#EDEDED; --black:#262626; --lp:#A380FF; --red:#C62836; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #000; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { position: fixed; inset: 0; width: 100%; height: 100%; height: var(--app-h, 100%); margin: 0; background: #000; overflow: hidden; color: var(--white); -webkit-font-smoothing: antialiased; touch-action: manipulation; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: var(--app-h, 100dvh); display: block; background: #000; touch-action: none; }
/* ── intro */
#intro { position: fixed; inset: 0; height: var(--app-h, 100%); z-index: 10; display: grid; place-items: center; background: #000; transition: opacity 1.6s ease, visibility 1.6s; }
body.playing #intro, body.ended #intro { opacity: 0; visibility: hidden; pointer-events: none; }
#intro .inner { text-align: center; display: grid; gap: 2.2rem; justify-items: center; padding: 2rem; }
#intro .en { font: 400 clamp(11px, 1.05vw, 14px)/1.6 "TMono", monospace; letter-spacing: .42em; text-transform: uppercase; color: rgba(237,237,237,.5); }
#intro .ar { font: 300 clamp(20px, 2.6vw, 34px)/1.6 "TArabic", sans-serif; color: rgba(237,237,237,.86); }
#intro .ar::after { content: ""; display: inline-block; width: .5em; height: .08em; margin-inline-start: .2em; background: var(--lp); vertical-align: .15em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#start { margin-top: .6rem; font: 500 12px/1 "TMono", monospace; letter-spacing: .5em; padding: 1.15em 2.2em 1.15em 2.7em; color: var(--white); background: transparent; border: 1px solid rgba(163,128,255,.45); cursor: pointer; position: relative; transition: border-color .4s, box-shadow .4s, color .4s, opacity .6s; opacity: .25; }
body.ready #start { opacity: 1; }
#start:hover, #start:focus-visible { border-color: var(--lp); box-shadow: 0 0 28px rgba(79,41,183,.55), inset 0 0 18px rgba(79,41,183,.35); outline: none; }
#start:disabled { cursor: default; }
#intro .hint { font: 400 10px/1 "TMono", monospace; letter-spacing: .35em; color: rgba(237,237,237,.3); }
#status { font: 400 10px "TMono", monospace; letter-spacing: .4em; color: rgba(163,128,255,.5); min-height: 1em; }
#intro .grain { position: absolute; inset: -50%; pointer-events: none; opacity: .06; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain .6s steps(4) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-1%,3%)} }
/* ── voice-over typography */
#subs { position: fixed; left: 0; right: 0; bottom: max(12.5vh, 72px); z-index: 4; display: grid; place-items: center; pointer-events: none; }
.vo-line { grid-area: 1 / 1; opacity: 0; font: 300 clamp(20px, 2.7vw, 40px)/1.5 "TArabic", sans-serif; color: rgba(237,237,237,.94); text-align: center; padding: 0 6vw; text-shadow: 0 0 2px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.8), 0 0 40px rgba(79,41,183,.55); will-change: opacity, filter, transform; }
.vo-line .w { display: inline-block; opacity: 0; }
.vo-line .emph { font-weight: 500; color: #fff; text-shadow: 0 0 2px #000, 0 0 12px rgba(0,0,0,.9), 0 0 30px rgba(163,128,255,.75), 0 0 60px rgba(79,41,183,.8); }
#subs::before { content: ''; position: absolute; left: 15%; right: 15%; top: -40%; bottom: -60%; background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.45), rgba(0,0,0,0)); opacity: var(--sub, 0); transition: opacity .6s; }
/* ── controls: present, never dominant */
#ctrl { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: 6px; opacity: 0; transition: opacity .8s; }
body.playing.ctrl-on #ctrl, body.ended #ctrl { opacity: .75; }
#ctrl button { width: 36px; height: 36px; display: grid; place-items: center; background: rgba(0,0,0,.25); border: 1px solid rgba(237,237,237,.14); color: rgba(237,237,237,.8); cursor: pointer; font: 500 9px "TMono", monospace; letter-spacing: .1em; }
#ctrl button:hover { border-color: rgba(163,128,255,.6); color: #fff; }
#ctrl button[hidden] { display: none; }
@media (pointer: coarse) {
  #ctrl { gap: 10px; }
  #ctrl button { width: 46px; height: 46px; }
  #ctrl svg { width: 20px; height: 20px; }
  #start { padding: 1.35em 2.2em 1.35em 2.7em; font-size: 13px; }
  #replay { padding: 28px 36px; }
}
@media (max-height: 480px) and (min-aspect-ratio: 1/1) {
  #intro .inner { gap: 1rem; padding: 1rem; }
  #intro .ar { font-size: 20px; }
  #subs { bottom: max(12vh, 44px); }
}
@media (max-aspect-ratio: 1/1) {
  #intro .en { letter-spacing: .28em; max-width: 86vw; }
  #subs { bottom: max(16vh, 96px); }
  .vo-line { font-size: clamp(19px, 5.4vw, 28px); padding: 0 8vw; }
}
#ctrl svg { width: 16px; height: 16px; }
#mute .x { display: none; } #mute.off .x { display: block; } #mute.off .w { display: none; }
#replay { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7; opacity: 0; visibility: hidden; transition: opacity 1.8s ease; background: transparent; border: none; color: rgba(237,237,237,.55); font: 400 10px "TMono", monospace; letter-spacing: .5em; cursor: pointer; display: grid; justify-items: center; gap: 14px; padding: 20px; }
#replay svg { width: 22px; height: 22px; }
#replay:hover { color: #fff; }
body.show-replay #replay { opacity: 1; visibility: visible; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="subs"></div>
<section id="intro">
  <div class="grain"></div>
  <div class="inner">
    <p class="en">There is a message not meant for everyone.</p>
    <p class="ar" dir="rtl">هناك رسالة لا يجب أن يقرأها الجميع.</p>
    <button id="start" disabled>START EXPERIENCE</button>
    <p class="hint">SOUND ON · HEADPHONES RECOMMENDED</p>
    <p id="status">LOADING</p>
  </div>
</section>
<div id="ctrl">
  <button id="mute" title="Sound on / off (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
  <button id="fs" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
</div>
<button id="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>REPLAY</button>
<script>/*__JS__*/</script>
</body>
</html>
